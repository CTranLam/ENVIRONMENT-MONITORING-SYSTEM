# Mosquitto broker for the Environment Monitoring System.
#
# Only the backend is an MQTT client; browsers never speak MQTT. The ESP8266
# devices publish telemetry here, the backend consumes it and fans it out to the
# frontend over WebSocket. See the deployment notes in Server/README.md.

# ---------------------------------------------------------------------------
# Listeners
# ---------------------------------------------------------------------------
listener 1883
protocol mqtt

# Uncomment to let browsers open an MQTT-over-WebSocket connection. Not used by
# the current design (the frontend communicates via backend WebSocket).
# listener 9001
# protocol websockets

# ---------------------------------------------------------------------------
# Authentication
# ---------------------------------------------------------------------------
# Anonymous access is refused. Create the password file before starting the
# broker (the exact command is in Server/README.md):
#
#   docker run --rm -it -v "$PWD/mosquitto:/mosquitto/config" eclipse-mosquitto:2 \
#     mosquitto_passwd -c -b /mosquitto/config/passwd ems-backend '<password>'
password_file /mosquitto/config/passwd
allow_anonymous false

# ---------------------------------------------------------------------------
# Persistence
# ---------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/

# ---------------------------------------------------------------------------
# Logging — stdout only, so `docker logs` is the single place to look.
# ---------------------------------------------------------------------------
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ---------------------------------------------------------------------------
# Limits — bound memory so a misbehaving device cannot grow the broker forever.
# ---------------------------------------------------------------------------
max_queued_messages 1000
max_inflight_messages 20
message_size_limit 8192
