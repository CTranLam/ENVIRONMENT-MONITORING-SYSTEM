spring:
  application:
    name: environment-monitoring-system

  servlet:
    multipart:
      # Profile avatars are small; cap them so one request cannot exhaust memory.
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    # Local PostgreSQL defaults. Override them with DB_URL, DB_USERNAME, and DB_PASSWORD.
    url: "${DB_URL:jdbc:postgresql://localhost:5435/environment_monitoring}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:postgres}"

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

app:
  mqtt:
    broker-url: "${MQTT_BROKER_URL:tcp://localhost:1883}"
    client-id: "${MQTT_CLIENT_ID:ems-backend}"
    username: "${MQTT_USERNAME:}"
    password: "${MQTT_PASSWORD:}"
    telemetry-topic: "${MQTT_TELEMETRY_TOPIC:home/sensor/data}"
    device-command-topic: "${MQTT_DEVICE_COMMAND_TOPIC:home/led/control}"
    device-status-topic: "${MQTT_DEVICE_STATUS_TOPIC:home/led/status}"
  security:
    jwt:
      # Required: a Base64-encoded secret with at least 256 bits.
      secret: "${JWT_SECRET}"
      expiration-minutes: "${JWT_EXPIRATION_MINUTES:60}"
    cors:
      allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:8081,http://localhost:8082}"
  storage:
    minio:
      # Internal endpoint used by the backend to read/write objects.
      endpoint: "${MINIO_ENDPOINT:http://localhost:9010}"
      access-key: "${MINIO_ACCESS_KEY:ems-minio}"
      secret-key: "${MINIO_SECRET_KEY:ems-minio-secret}"
      bucket: "${MINIO_BUCKET:ems-avatars}"
      # Base URL browsers use to fetch the objects. Defaults to endpoint/bucket.
      public-url: "${MINIO_PUBLIC_URL:}"
      # Object prefix for uploaded profile pictures.
      avatar-prefix: "avatars"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
