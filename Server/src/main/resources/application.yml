spring:
  application:
    name: environment-monitoring-system

  datasource:
    # Local PostgreSQL defaults. Override them with DB_URL, DB_USERNAME, and DB_PASSWORD.
    url: "${DB_URL:jdbc:postgresql://localhost:5435/environment_monitoring}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:postgres}"

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

app:
  mqtt:
    broker-url: "${MQTT_BROKER_URL:tcp://localhost:1883}"
    client-id: "${MQTT_CLIENT_ID:ems-backend}"
    username: "${MQTT_USERNAME:}"
    password: "${MQTT_PASSWORD:}"
    telemetry-topic: "${MQTT_TELEMETRY_TOPIC:home/sensor/data}"
    device-command-topic: "${MQTT_DEVICE_COMMAND_TOPIC:home/led/control}"
    device-status-topic: "${MQTT_DEVICE_STATUS_TOPIC:home/led/status}"
  security:
    jwt:
      # Required: a Base64-encoded secret with at least 256 bits.
      secret: "${JWT_SECRET}"
      expiration-minutes: "${JWT_EXPIRATION_MINUTES:60}"
    cors:
      allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:8081,http://localhost:8082}"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
